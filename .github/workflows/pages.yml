name: Publier PWA Pocket
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Compiler pour le chemin GitHub Pages
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          NAME="${REPOSITORY#*/}"
          if [[ "$NAME" == *.github.io ]]; then BASE="/"; else BASE="/$NAME/"; fi
          npm run build -- --base-href="$BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa-pocket/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
